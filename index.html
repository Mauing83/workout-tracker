<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Workout Tracker</title>
  
  <!-- Apple Touch Icon for iOS Home Screen -->
  <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='%23121212' rx='20'/><path d='M25 45h10v10H25zm40 0h10v10H65z' fill='%2300E676'/><path d='M35 48h30v4H35z' fill='%2300E676'/><rect x='18' y='38' width='7' height='24' rx='2' fill='%2300E676'/><rect x='75' y='38' width='7' height='24' rx='2' fill='%2300E676'/></svg>">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  
  <style>
    :root {
      --bg-color: #121212;
      --card-bg: #1E1E1E;
      --accent-color: #00E676;
      --text-color: #FFFFFF;
      --text-dim: #AAAAAA;
      --border-color: #2C2C2C;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      padding: 20px;
      padding-top: max(20px, env(safe-area-inset-top));
      padding-bottom: max(20px, env(safe-area-inset-bottom));
      max-width: 500px;
      margin: 0 auto;
    }

    h1 {
      font-size: 24px;
      margin-bottom: 15px;
      color: var(--accent-color);
      text-align: center;
    }

    .card {
      background-color: var(--card-bg);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 16px;
      border: 1px solid var(--border-color);
    }

    label {
      display: block;
      font-size: 14px;
      color: var(--text-dim);
      margin-bottom: 6px;
    }

    select, input, button {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      background-color: #252525;
      color: var(--text-color);
      font-size: 16px;
      margin-bottom: 12px;
      outline: none;
    }

    select:focus, input:focus {
      border-color: var(--accent-color);
    }

    button {
      background-color: var(--accent-color);
      color: #000;
      font-weight: bold;
      border: none;
      cursor: pointer;
      margin-top: 8px;
      transition: opacity 0.2s;
    }

    button:active {
      opacity: 0.8;
    }

    .log-item {
      padding: 10px;
      border-bottom: 1px solid var(--border-color);
      font-size: 14px;
      display: flex;
      justify-content: space-between;
    }

    .log-item:last-child {
      border-bottom: none;
    }

    #status {
      text-align: center;
      font-size: 14px;
      color: var(--accent-color);
      margin-top: 8px;
      min-height: 20px;
    }
  </style>
</head>
<body>

  <h1>Workout Tracker</h1>

  <div class="card">
    <label for="program">Program</label>
    <select id="program" onchange="updateDayOptions()">
      <option value="Calisthenics">Calisthenics</option>
      <option value="Dumbbell">Dumbbell</option>
    </select>

    <label for="day">Workout Day</label>
    <select id="day" onchange="updateExerciseOptions()">
      <!-- Populated dynamically -->
    </select>

    <label for="exercise">Exercise</label>
    <select id="exercise">
      <!-- Populated dynamically -->
    </select>

    <div style="display: flex; gap: 10px;">
      <div style="flex: 1;">
        <label for="set">Set #</label>
        <input type="number" id="set" placeholder="1" value="1">
      </div>
      <div style="flex: 2;">
        <label for="reps">Reps / Weight</label>
        <input type="text" id="reps" placeholder="e.g. 15 reps / 20kg">
      </div>
    </div>

    <label for="notes">Notes</label>
    <input type="text" id="notes" placeholder="Optional notes">

    <button onclick="logWorkout()">Log Set</button>
    <div id="status"></div>
  </div>

  <div class="card">
    <h2 style="font-size: 18px; margin-bottom: 10px;">Recent Logs</h2>
    <div id="logHistory">No sets logged yet today.</div>
  </div>

  <script>
    // Live Google Apps Script Web App URL
    const GOOGLE_SHEETS_API_URL = "https://script.google.com/macros/s/AKfycbyiZgnyilBHTyL9iuQ2eRYrpALe5ODvZBqHdPqtasxHaUmG6DpfUdoP7ZWo-JWMxtPO/exec";

    // 5-Day Workout Libraries for both programs
    const workoutData = {
      "Calisthenics": {
        "Day 1 - Upper Body (Push Focus)": ["Pull-ups", "Push-ups", "Pike Push-ups", "Dips", "Inverted Rows"],
        "Day 2 - Lower Body & Core": ["Bodyweight Squats", "Bulgarian Split Squats", "Walking Lunges", "Calf Raises", "Plank Hold"],
        "Day 3 - Upper Body (Pull Focus)": ["Chin-ups", "Wide Grip Pull-ups", "Australian Pull-ups", "Pike Push-ups", "Arm Circles"],
        "Day 4 - Athletic Conditioning": ["Burpees", "Jump Squats", "Mountain Climbers", "Leg Raises", "Skaters"],
        "Day 5 - Full Body Hypertrophy": ["Archer Push-ups", "Pistol Squats (Assisted)", "Diamond Push-ups", "Hanging Knee Raises", "Supermans"]
      },
      "Dumbbell": {
        "Day 1 - Upper Body (Chest & Back)": ["DB Bench Press", "One-Arm DB Row", "DB Incline Press", "DB Pullover", "DB Flyes"],
        "Day 2 - Lower Body (Quads & Glutes)": ["DB Goblet Squats", "DB Romanian Deadlifts", "DB Walking Lunges", "DB Calf Raises", "Weighted Crunch"],
        "Day 3 - Shoulders & Arms": ["DB Overhead Press", "DB Lateral Raises", "DB Front Raises", "DB Bicep Curls", "DB Overhead Tricep Extension"],
        "Day 4 - Lower Body (Posterior Chain)": ["DB Sumo Deadlifts", "DB Bulgarian Split Squats", "DB Step-Ups", "DB Single-Leg RDL", "Seated Calf Raises"],
        "Day 5 - Full Body Power": ["DB Thrusters", "DB Renegade Rows", "DB Floor Press", "DB Clean & Press", "DB Hammer Curls"]
      }
    };

    function updateDayOptions() {
      const programSelect = document.getElementById('program');
      const daySelect = document.getElementById('day');
      const selectedProgram = programSelect.value;
      
      daySelect.innerHTML = '';
      const days = Object.keys(workoutData[selectedProgram]);
      days.forEach(day => {
        const opt = document.createElement('option');
        opt.value = day;
        opt.textContent = day;
        daySelect.appendChild(opt);
      });
      updateExerciseOptions();
    }

    function updateExerciseOptions() {
      const programSelect = document.getElementById('program');
      const daySelect = document.getElementById('day');
      const exerciseSelect = document.getElementById('exercise');
      
      const selectedProgram = programSelect.value;
      const selectedDay = daySelect.value;
      
      exerciseSelect.innerHTML = '';
      if (workoutData[selectedProgram] && workoutData[selectedProgram][selectedDay]) {
        workoutData[selectedProgram][selectedDay].forEach(ex => {
          const opt = document.createElement('option');
          opt.value = ex;
          opt.textContent = ex;
          exerciseSelect.appendChild(opt);
        });
      }
    }

    // Initialize dropdowns on load
    updateDayOptions();

    let logs = JSON.parse(localStorage.getItem('workoutLogs')) || [];

    function renderLogs() {
      const historyDiv = document.getElementById('logHistory');
      if (logs.length === 0) {
        historyDiv.innerHTML = "No sets logged yet today.";
        return;
      }
      historyDiv.innerHTML = logs.slice(-5).reverse().map(l => `
        <div class="log-item">
          <div><strong>${l.exercise}</strong> (Set ${l.set})</div>
          <div>${l.repsOrWeight}</div>
        </div>
      `).join('');
    }

    async function logWorkout() {
      const statusDiv = document.getElementById('status');
      const payload = {
        program: document.getElementById('program').value,
        day: document.getElementById('day').value,
        exercise: document.getElementById('exercise').value,
        set: document.getElementById('set').value,
        repsOrWeight: document.getElementById('reps').value,
        notes: document.getElementById('notes').value
      };

      if (!payload.repsOrWeight) {
        statusDiv.style.color = "#FF5252";
        statusDiv.innerText = "Please enter reps or weight.";
        return;
      }

      statusDiv.style.color = "var(--accent-color)";
      statusDiv.innerText = "Saving to Google Sheets...";

      // Store in local storage
      logs.push(payload);
      localStorage.setItem('workoutLogs', JSON.stringify(logs));
      renderLogs();

      // Sync to Google Sheets API
      try {
        await fetch(GOOGLE_SHEETS_API_URL, {
          method: "POST",
          mode: "no-cors",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });
        statusDiv.innerText = "Logged successfully!";
        // Increment set number automatically
        document.getElementById('set').value = parseInt(payload.set || 1) + 1;
      } catch (err) {
        console.error(err);
        statusDiv.style.color = "#FF5252";
        statusDiv.innerText = "Saved locally (Sheets offline)";
      }

      setTimeout(() => { statusDiv.innerText = ""; }, 3000);
    }

    // Initial render on load
    renderLogs();
  </script>
</body>
</html>
