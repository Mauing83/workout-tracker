<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Workout Tracker</title>
  
  <!-- Apple Touch Icon for iOS Home Screen -->
  <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='%23121212' rx='20'/><path d='M25 45h10v10H25zm40 0h10v10H65z' fill='%2300E676'/><path d='M35 48h30v4H35z' fill='%2300E676'/><rect x='18' y='38' width='7' height='24' rx='2' fill='%2300E676'/><rect x='75' y='38' width='7' height='24' rx='2' fill='%2300E676'/></svg>">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  
  <style>
    :root {
      --bg-color: #121212;
      --card-bg: #1E1E1E;
      --accent-color: #00E676;
      --text-color: #FFFFFF;
      --text-dim: #AAAAAA;
      --border-color: #2C2C2C;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      padding: 20px;
      padding-top: max(20px, env(safe-area-inset-top));
      padding-bottom: max(20px, env(safe-area-inset-bottom));
      max-width: 500px;
      margin: 0 auto;
    }

    h1 {
      font-size: 24px;
      margin-bottom: 15px;
      color: var(--accent-color);
      text-align: center;
    }

    .card {
      background-color: var(--card-bg);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 16px;
      border: 1px solid var(--border-color);
    }

    label {
      display: block;
      font-size: 14px;
      color: var(--text-dim);
      margin-bottom: 6px;
    }

    select, input, button {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      background-color: #252525;
      color: var(--text-color);
      font-size: 16px;
      margin-bottom: 12px;
      outline: none;
    }

    select:focus, input:focus {
      border-color: var(--accent-color);
    }

    button {
      background-color: var(--accent-color);
      color: #000;
      font-weight: bold;
      border: none;
      cursor: pointer;
      margin-top: 8px;
      transition: opacity 0.2s;
    }

    button:active {
      opacity: 0.8;
    }

    .recommendation-box {
      background-color: #16291E;
      border: 1px dashed var(--accent-color);
      border-radius: 8px;
      padding: 10px 12px;
      margin-bottom: 12px;
      font-size: 13px;
      color: #E0E0E0;
    }

    .recommendation-box strong {
      color: var(--accent-color);
    }

    .log-item {
      padding: 10px;
      border-bottom: 1px solid var(--border-color);
      font-size: 14px;
      display: flex;
      justify-content: space-between;
    }

    .log-item:last-child {
      border-bottom: none;
    }

    #status {
      text-align: center;
      font-size: 14px;
      color: var(--accent-color);
      margin-top: 8px;
      min-height: 20px;
    }
  </style>
</head>
<body>

  <h1>Workout Tracker</h1>

  <div class="card">
    <label for="program">Program</label>
    <select id="program" onchange="updateDayOptions()">
      <option value="Dumbbell">Dumbbell (5-Day PDF Plan)</option>
      <option value="Calisthenics">Calisthenics</option>
    </select>

    <label for="day">Workout Day</label>
    <select id="day" onchange="updateExerciseOptions()">
      <!-- Populated dynamically -->
    </select>

    <label for="exercise">Exercise</label>
    <select id="exercise" onchange="updateRecommendation()">
      <!-- Populated dynamically -->
    </select>

    <!-- PDF Guide Target Reference Box -->
    <div id="recBox" class="recommendation-box">
      Target: Select an exercise
    </div>

    <div style="display: flex; gap: 10px;">
      <div style="flex: 1;">
        <label for="set">Set #</label>
        <input type="number" id="set" placeholder="1" value="1">
      </div>
      <div style="flex: 2;">
        <label for="reps">Reps / Weight Logged</label>
        <input type="text" id="reps" placeholder="e.g. 18kg x 10">
      </div>
    </div>

    <label for="notes">Notes</label>
    <input type="text" id="notes" placeholder="Optional notes">

    <button onclick="logWorkout()">Log Set</button>
    <div id="status"></div>
  </div>

  <div class="card">
    <h2 style="font-size: 18px; margin-bottom: 10px;">Recent Logs</h2>
    <div id="logHistory">No sets logged yet today.</div>
  </div>

  <script>
    // Live Google Apps Script Web App URL
    const GOOGLE_SHEETS_API_URL = "https://script.google.com/macros/s/AKfycbyiZgnyilBHTyL9iuQ2eRYrpALe5ODvZBqHdPqtasxHaUmG6DpfUdoP7ZWo-JWMxtPO/exec";

    // Workout Data matching official PDF guides exactly
    const workoutData = {
      "Dumbbell": {
        "Day 1 - Push (Chest / Shoulders / Triceps)": {
          "Dumbbell bench press": "Set 1: 12kg x 20 (45s) | Set 2: 18kg x 10 (45s) | Set 3: 20-22kg x 5 (90s)",
          "Dumbbell incline press": "Set 1: 10kg x 15-20 (45s) | Set 2: 14kg x 10-12 (45s) | Set 3: 16kg x 6 (90s)",
          "Dips (bw/weighted)": "Set 1: BW x 15-20 (45s) | Set 2: BW/light x 10-12 (45s) | Set 3: Weighted x 6-8 (90s)",
          "Dumbbell shoulder press": "Set 1: 11kg x 15-20 (45s) | Set 2: 16kg x 10 (45s) | Set 3: 18-20kg x 5 (90s)",
          "Dumbbell lateral raises": "Set 1: 6-7kg x 15-20 (30s) | Set 2: 10kg x 12-15 (30s) | Set 3: Skip",
          "Overhead triceps extension": "Set 1: 10-11kg x 15-20 (30s) | Set 2: 16kg x 12 (30s) | Set 3: 18kg x 6 (60s)"
        },
        "Day 2 - Pull (Back / Biceps)": {
          "Pull-ups": "Set 1: BW AMRAP aim 15+ (45s) | Set 2: BW x 8-10 (45s) | Set 3: Weighted x 4-6 (90s)",
          "Dumbbell bent-over rows": "Set 1: 12kg x 15-20 (45s) | Set 2: 16-18kg x 10 (45s) | Set 3: 20kg x 5-6 (90s)",
          "Dumbbell single-arm rows": "Set 1: 11kg x 15-20 (45s) | Set 2: 16kg x 10-12 (45s) | Set 3: 18-20kg x 6 (90s)",
          "Chin-ups": "Set 1: BW AMRAP (45s) | Set 2: BW to failure (45s) | Set 3: Weighted x 4-6 (90s)",
          "Dumbbell bicep curls": "Set 1: 7-8kg x 15-20 (30s) | Set 2: 11.5kg x 10-12 (30s) | Set 3: 13-14kg x 6 (60s)",
          "Dumbbell hammer curls": "Set 1: 7-8kg x 15-20 (30s) | Set 2: 10-11kg x 12 (30s) | Set 3: Skip"
        },
        "Day 3 - Legs + Core": {
          "Dumbbell goblet squats": "Set 1: 12kg x 15-20 (45s) | Set 2: 18kg x 10-12 (45s) | Set 3: 22-24kg x 5 (120s)",
          "Dumbbell Romanian deadlifts": "Set 1: 11kg x 15-20 (45s) | Set 2: 16kg x 10-12 (45s) | Set 3: 18-20kg x 5-6 (120s)",
          "Dumbbell walking lunges": "Set 1: 11kg x 15-20/leg (45s) | Set 2: 16kg x 10/leg (45s) | Set 3: 18-20kg x 5-6/leg (120s)",
          "Bulgarian squats": "Set 1: 11kg x 15-20/leg (45s) | Set 2: 16kg x 12/leg (45s) | Set 3: 18kg x 6/leg (90s)",
          "Dumbbell calf raises": "Set 1: Light-mod x 20 (30s) | Set 2: Moderate x 15-20 (30s) | Set 3: Skip",
          "Hanging leg raises": "Set 1: AMRAP (30s) | Set 2: 12-15 controlled (30s) | Set 3: N/A"
        },
        "Day 4 - Upper A (Chest / Back / Shoulders / Arms)": {
          "Dumbbell incline press": "Set 1: 10kg x 15-20 (45s) | Set 2: 14-15kg x 10 (45s) | Set 3: 17kg x 6 (90s)",
          "Dumbbell single-arm rows": "Set 1: 11kg x 15-20 (45s) | Set 2: 16kg x 10-12 (45s) | Set 3: 18kg x 6 (90s)",
          "Dumbbell Arnold press": "Set 1: 10kg x 15-20 (45s) | Set 2: 14kg x 10-12 (45s) | Set 3: 16kg x 6 (90s)",
          "Dips": "Set 1: BW x 15-20 (45s) | Set 2: BW/light x 10-12 (45s) | Set 3: Weighted x 6-8 (90s)",
          "Wide-grip pull-ups": "Set 1: BW AMRAP (45s) | Set 2: BW x 8-10 (45s) | Set 3: Weighted x 4-6 (90s)",
          "Dumbbell curls (alternate bicep/hammer)": "Set 1: 7-8kg x 15-20 (30s) | Set 2: 11kg x 10-12 (30s) | Set 3: Skip"
        },
        "Day 5 - Upper B (Back / Shoulders / Arms + Core)": {
          "Chin-ups": "Set 1: BW AMRAP (45s) | Set 2: BW to failure (45s) | Set 3: Weighted x 4-6 (90s)",
          "Dumbbell bent-over rows": "Set 1: 12kg x 15-20 (45s) | Set 2: 16-18kg x 10 (45s) | Set 3: 20kg x 5-6 (90s)",
          "Dumbbell lateral raises": "Set 1: 6-7kg x 15-20 (30s) | Set 2: 10kg x 12-15 (30s) | Set 3: Skip",
          "Overhead triceps extension": "Set 1: 10-11kg x 15-20 (30s) | Set 2: 16kg x 12 (30s) | Set 3: 18kg x 6 (60s)",
          "Dumbbell hammer curls": "Set 1: 7-8kg x 15-20 (30s) | Set 2: 10-11kg x 12 (30s) | Set 3: Skip",
          "Weighted sit-ups / Russian twists": "Set 1: Light x 20 (30s) | Set 2: Moderate x 15-20 (30s) | Set 3: N/A"
        }
      },
      "Calisthenics": {
        "Day 1 - Upper Body (Push Focus)": {
          "Pull-ups": "Target: 3-4 sets x 8-12 reps (Bodyweight)",
          "Push-ups": "Target: 3-4 sets x 15-20 reps (Bodyweight)",
          "Pike Push-ups": "Target: 3 sets x 8-12 reps",
          "Dips": "Target: 3 sets x 10-15 reps",
          "Inverted Rows": "Target: 3 sets x 10-12 reps"
        },
        "Day 2 - Lower Body & Core": {
          "Bodyweight Squats": "Target: 3-4 sets x 20-25 reps",
          "Bulgarian Split Squats": "Target: 3 sets x 10-12 reps per leg",
          "Walking Lunges": "Target: 3 sets x 12-16 steps total",
          "Calf Raises": "Target: 3 sets x 20 reps",
          "Plank Hold": "Target: 3 sets x 45-60 seconds"
        },
        "Day 3 - Upper Body (Pull Focus)": {
          "Chin-ups": "Target: 3-4 sets x 6-10 reps",
          "Wide Grip Pull-ups": "Target: 3 sets x 6-8 reps",
          "Australian Pull-ups": "Target: 3 sets x 12-15 reps",
          "Pike Push-ups": "Target: 3 sets x 10 reps",
          "Arm Circles": "Target: 2 sets x 30s continuous"
        },
        "Day 4 - Athletic Conditioning": {
          "Burpees": "Target: 4 rounds x 15 reps",
          "Jump Squats": "Target: 3 sets x 12-15 explosive reps",
          "Mountain Climbers": "Target: 3 sets x 40 reps total",
          "Leg Raises": "Target: 3 sets x 12-15 reps",
          "Skaters": "Target: 3 sets x 30 seconds"
        },
        "Day 5 - Full Body Hypertrophy": {
          "Archer Push-ups": "Target: 3 sets x 6-8 reps per side",
          "Pistol Squats (Assisted)": "Target: 3 sets x 5-8 reps per leg",
          "Diamond Push-ups": "Target: 3 sets x 10-12 reps",
          "Hanging Knee Raises": "Target: 3 sets x 10-15 reps",
          "Supermans": "Target: 3 sets x 15 reps"
        }
      }
    };

    function updateDayOptions() {
      const programSelect = document.getElementById('program');
      const daySelect = document.getElementById('day');
      const selectedProgram = programSelect.value;
      
      daySelect.innerHTML = '';
      const days = Object.keys(workoutData[selectedProgram]);
      days.forEach(day => {
        const opt = document.createElement('option');
        opt.value = day;
        opt.textContent = day;
        daySelect.appendChild(opt);
      });
      updateExerciseOptions();
    }

    function updateExerciseOptions() {
      const programSelect = document.getElementById('program');
      const daySelect = document.getElementById('day');
      const exerciseSelect = document.getElementById('exercise');
      
      const selectedProgram = programSelect.value;
      const selectedDay = daySelect.value;
      
      exerciseSelect.innerHTML = '';
      if (workoutData[selectedProgram] && workoutData[selectedProgram][selectedDay]) {
        const exercises = Object.keys(workoutData[selectedProgram][selectedDay]);
        exercises.forEach(ex => {
          const opt = document.createElement('option');
          opt.value = ex;
          opt.textContent = ex;
          exerciseSelect.appendChild(opt);
        });
      }
      updateRecommendation();
    }

    function updateRecommendation() {
      const program = document.getElementById('program').value;
      const day = document.getElementById('day').value;
      const exercise = document.getElementById('exercise').value;
      const recBox = document.getElementById('recBox');

      if (workoutData[program] && workoutData[program][day] && workoutData[program][day][exercise]) {
        recBox.innerHTML = `<strong>PDF Target:</strong> ${workoutData[program][day][exercise]}`;
      } else {
        recBox.innerHTML = `<strong>PDF Target:</strong> Follow recommended rep range.`;
      }
    }

    // Initialize dropdowns on load
    updateDayOptions();

    let logs = JSON.parse(localStorage.getItem('workoutLogs')) || [];

    function renderLogs() {
      const historyDiv = document.getElementById('logHistory');
      if (logs.length === 0) {
        historyDiv.innerHTML = "No sets logged yet today.";
        return;
      }
      historyDiv.innerHTML = logs.slice(-5).reverse().map(l => `
        <div class="log-item">
          <div><strong>${l.exercise}</strong> (Set ${l.set})</div>
          <div>${l.repsOrWeight}</div>
        </div>
      `).join('');
    }

    async function logWorkout() {
      const statusDiv = document.getElementById('status');
      const payload = {
        program: document.getElementById('program').value,
        day: document.getElementById('day').value,
        exercise: document.getElementById('exercise').value,
        set: document.getElementById('set').value,
        repsOrWeight: document.getElementById('reps').value,
        notes: document.getElementById('notes').value
      };

      if (!payload.repsOrWeight) {
        statusDiv.style.color = "#FF5252";
        statusDiv.innerText = "Please enter reps or weight.";
        return;
      }

      statusDiv.style.color = "var(--accent-color)";
      statusDiv.innerText = "Saving to Google Sheets...";

      // Store in local storage
      logs.push(payload);
      localStorage.setItem('workoutLogs', JSON.stringify(logs));
      renderLogs();

      // Sync to Google Sheets API
      try {
        await fetch(GOOGLE_SHEETS_API_URL, {
          method: "POST",
          mode: "no-cors",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });
        statusDiv.innerText = "Logged successfully!";
        // Increment set number automatically
        document.getElementById('set').value = parseInt(payload.set || 1) + 1;
      } catch (err) {
        console.error(err);
        statusDiv.style.color = "#FF5252";
        statusDiv.innerText = "Saved locally (Sheets offline)";
      }

      setTimeout(() => { statusDiv.innerText = ""; }, 3000);
    }

    // Initial render on load
    renderLogs();
  </script>
</body>
</html>
